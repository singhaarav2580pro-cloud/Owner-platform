<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Owner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-gray-100 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Owner Content Manager</h1>
                <p class="text-sm text-gray-500">Upload and manage content that appears on the user website.</p>
            </div>
            <a href="user.html" target="_blank" class="px-4 py-2 bg-indigo-50 text-indigo-600 font-medium rounded-xl hover:bg-indigo-100 transition">View User Site ↗</a>
        </header>

        <!-- Upload Form Card -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-gray-100">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Add New Content / File</h2>
            <form id="uploadForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Item Title</label>
                    <input type="text" id="title" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="e.g. Premium Web Template">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea id="description" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Describe the item or service..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Upload Image / File</label>
                    <input type="file" id="fileInput" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">Publish to User Website</button>
            </form>
        </div>

        <!-- Managed Content List -->
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Uploaded Content Inventory</h2>
            <div id="contentList" class="space-y-4">
                <!-- Dynamically populated items will appear here -->
                <p class="text-gray-400 text-sm italic">No items uploaded yet.</p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const contentList = document.getElementById('contentList');

        function getStoredData() {
            return JSON.parse(localStorage.getItem('siteData')) || [];
        }

        function saveData(data) {
            localStorage.setItem('siteData', JSON.stringify(data));
        }

        function renderOwnerList() {
            const data = getStoredData();
            if (data.length === 0) {
                contentList.innerHTML = '<p class="text-gray-400 text-sm italic">No items uploaded yet.</p>';
                return;
            }

            contentList.innerHTML = data.map((item, index) => `
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <div class="flex items-center space-x-4">
                        <img src="${item.file}" class="w-16 h-16 object-cover rounded-lg border">
                        <div>
                            <h3 class="font-semibold text-gray-800">${item.title}</h3>
                            <p class="text-sm text-gray-600 line-clamp-1">${item.description}</p>
                        </div>
                    </div>
                    <button onclick="deleteItem(${index})" class="px-3 py-1.5 bg-red-50 text-red-600 rounded-lg text-sm font-medium hover:bg-red-100 transition">Delete</button>
                </div>
            `).join('');
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const fileInput = document.getElementById('fileInput');

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Image = event.target.result;
                const currentData = getStoredData();
                
                currentData.push({
                    title: title,
                    description: description,
                    file: base64Image,
                    date: new Date().toLocaleDateString()
                });

                saveData(currentData);
                form.reset();
                renderOwnerList();
                alert('Content successfully published to the user website!');
            };

            if (fileInput.files[0]) {
                reader.readAsDataURL(fileInput.files[0]);
            }
        });

        window.deleteItem = function(index) {
            let data = getStoredData();
            data.splice(index, 1);
            saveData(data);
            renderOwnerList();
        }

        renderOwnerList();
    </script>
</body>
</html>
